[project]
name = "PINN-SYSID"
version = "0.1.0"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0.0",
    "pytest>=7.0.0",
    "filterpy>=0.2.0",
    "mne>=1.4.0",
]
requires-python = ">=3.10"
authors = [
    { name = "Johann Herring", email = "jgherrin@usc.edu" }
]
maintainers = [
    { name = "Johann Herring", email = "jgherrin@usc.edu" }
]
description = "Physics Informed System Identification for Model-Based Closed Loop Seizure Control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["physics-informed neural networks", "system identification", "deep learning", "control  systems", "kalman filter", "seizure control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
repository = "https://github.com/JHerr21/PINN-SYSID"