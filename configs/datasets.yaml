# T1.5: synthetic datasets for the H1 sweep. Run with experiments/02_datasets.py.
name: datasets
seed: 0                   # base for the sim-seed formula in 02_datasets.py

p_mean: 90.0              # Hz (chosen in T1.4)
sigma: 1.326              # Hz*sqrt(s): Wendling's SD 30 Hz per sample at 512 Hz (chosen in T1.5)
transient_s: 2.0          # s dropped from the start of every record

A_values: [3.25, 3.75, 4.0, 4.5]   # mV: 1 healthy (nominal) + 3 seizure-level (T1.4)
n_seeds: 10                        # per cell

# H1 factor levels; one factor varies at a time around the nominal
durations_s: [2.0, 5.0, 10.0, 20.0]
snr_db: [20.0, 10.0, 5.0, 0.0]
n_records: [1, 3, 5]
nominal:
  duration_s: 10.0
  snr_db: 10.0
  n_records: 1

out_dir: data/synthetic   # relative to the repo root
